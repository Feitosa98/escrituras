# Clean install, lint and production build on the supported Node.js versions.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Build
      run: npm run build
    - name: Dependency audit
      run: npm audit --audit-level=high

  hostinger-cloud:
    name: Hostinger Cloud PHP/MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_DATABASE: escrituras_test
          MYSQL_USER: escrituras_app
          MYSQL_PASSWORD: app_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_test_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate PHP syntax
        run: find hostinger -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prepare MySQL database
        run: |
          for attempt in {1..30}; do
            if mysql -h 127.0.0.1 -u escrituras_app -papp_test_password -e "SELECT 1" escrituras_test >/dev/null 2>&1; then
              sleep 3
              if mysql -h 127.0.0.1 -u escrituras_app -papp_test_password -e "SELECT 1" escrituras_test >/dev/null 2>&1; then
                break
              fi
            fi
            sleep 2
          done
          mysql -h 127.0.0.1 -u escrituras_app -papp_test_password escrituras_test < hostinger/schema.mysql.sql
      - name: Configure isolated test environment
        run: |
          cp hostinger/config.example.php hostinger/config.php
          sed -i "s/'host' => 'localhost'/'host' => '127.0.0.1'/; s/u000000000_escrituras/escrituras_test/; s/u000000000_app/escrituras_app/; s/ALTERE_ESTA_SENHA/app_test_password/; s/ALTERE_POR_UM_SEGREDO_ALEATORIO_DE_64_CARACTERES/test_jwt_secret_0123456789012345678901234567890123456789/; s/ALTERE_POR_OUTRO_SEGREDO_ALEATORIO_DE_64_CARACTERES/test_encryption_secret_012345678901234567890123456789/" hostinger/config.php
      - name: Run API smoke tests
        run: |
          HASH=$(php -r 'echo password_hash("Senha-De-Teste-2026!", PASSWORD_BCRYPT);')
          mysql -h 127.0.0.1 -u escrituras_app -papp_test_password escrituras_test -e "INSERT INTO users(uuid,nome,username,email,senha_hash,role,access_start,access_end) VALUES(UUID(),'Administrador Sistema','admin.sistema','admin@sistema.local','$HASH','admin','00:00','23:59');"
          php -S 127.0.0.1:8080 hostinger/dev-router.php >/tmp/escrituras-php.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID; cat /tmp/escrituras-php.log' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          LOGIN=$(curl -fsS -H 'Content-Type: application/json' -d '{"usuario":"admin.sistema","senha":"Senha-De-Teste-2026!"}' http://127.0.0.1:8080/api/auth/login)
          TOKEN=$(printf '%s' "$LOGIN" | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["token"]??"";')
          test -n "$TOKEN"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/users/options
          USER=$(curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"nome":"Usuário de Métricas","username":"metricas.usuario","senha":"Senha-Forte-Teste-2026!","role":"visualizador","access_start":"00:00","access_end":"23:59"}' http://127.0.0.1:8080/api/users)
          USERNAME=$(printf '%s' "$USER" | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["username"]??"";')
          USER_ID=$(printf '%s' "$USER" | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["id"]??"";')
          test "$USERNAME" = "metricas.usuario"
          VIS_LOGIN=$(curl -fsS -H 'Content-Type: application/json' -d '{"usuario":"metricas.usuario","senha":"Senha-Forte-Teste-2026!"}' http://127.0.0.1:8080/api/auth/login)
          VIS_TOKEN=$(printf '%s' "$VIS_LOGIN" | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["token"]??"";')
          test -n "$USER_ID" && test -n "$VIS_TOKEN"
          ACT=$(curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"tipo":"ESCRITURA PUBLICA","tipoAcompanhamento":"EPTT","selagem":"2026-08-21","livro":"TESTE-1","folha":"1","outorgante":"REQUERENTE TESTE","outorgado":"OUTORGADO TESTE","emailCliente":"teste@example.com","escrevente":"Administrador Sistema","tipoLivro":"NOTAS","mes":"08","ano":"2026"}' http://127.0.0.1:8080/api/escrituras)
          CODE=$(printf '%s' "$ACT" | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["acompanhamento_codigo"]??"";')
          PASS=$(printf '%s' "$ACT" | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["senha_cliente"]??"";')
          ID=$(printf '%s' "$ACT" | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["id"]??"";')
          test -n "$CODE" && test -n "$PASS" && test -n "$ID"
          DETAIL=$(curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/escrituras/$ID)
          ! printf '%s' "$DETAIL" | grep -q 'senha_cliente'
          curl -fsS -H "Authorization: Bearer $TOKEN" 'http://127.0.0.1:8080/api/escrituras?busca=REQUERENTE&paginar=true&page=1&limit=20'
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/escrituras/stats
          curl -fsS -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"status":"Minuta / Solicitações","observacao":"Teste do fluxo"}' http://127.0.0.1:8080/api/escrituras/$ID/status
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/escrituras/$ID/historico
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/escrituras/$ID/checklist
          ITEM=$(curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"titulo":"Conferir documento de teste"}' http://127.0.0.1:8080/api/escrituras/$ID/checklist)
          ITEM_ID=$(printf '%s' "$ITEM" | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["id"]??"";')
          curl -fsS -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"concluido":true}' http://127.0.0.1:8080/api/escrituras/$ID/checklist/$ITEM_ID
          SCHEDULE=$(curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "{\"escritura_id\":$ID,\"user_id\":1,\"titulo\":\"Assinatura de teste\",\"data_agendada\":\"2026-08-22 10:00:00\"}" http://127.0.0.1:8080/api/agendamentos)
          SCHEDULE_ID=$(printf '%s' "$SCHEDULE" | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["id"]??"";')
          curl -fsS -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"concluido":true}' http://127.0.0.1:8080/api/agendamentos/$SCHEDULE_ID
          curl -fsS -H "Authorization: Bearer $TOKEN" 'http://127.0.0.1:8080/api/agendamentos?mes=08&ano=2026'
          FORBIDDEN=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VIS_TOKEN" -H 'Content-Type: application/json' -d '{"tipo":"TESTE SEM PERMISSAO"}' http://127.0.0.1:8080/api/escrituras)
          test "$FORBIDDEN" = "403"
          mysql -h 127.0.0.1 -u escrituras_app -papp_test_password escrituras_test -e "UPDATE escrituras SET created_by=NULL,escrevente='Usuário de Métricas' WHERE id=$ID;"
          curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "{\"trimestre\":\"T3\",\"ano\":2026,\"metaTotal\":3,\"metasIndividuais\":[{\"userId\":$USER_ID,\"quantidade\":3}]}" http://127.0.0.1:8080/api/metas
          METRICS=$(curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/metas/relatorio/individual/$USER_ID/T3/2026)
          PRODUCTION=$(printf '%s' "$METRICS" | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["producao"]??"";')
          test "$PRODUCTION" = "1"
          TEAM=$(curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/metas/relatorio/equipe/T3/2026)
          TEAM_PRODUCTION=$(printf '%s' "$TEAM" | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["producao"]??"";')
          test "$TEAM_PRODUCTION" = "1"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/metas/ranking/T3/2026
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/metas/projecao/T3/2026
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/admin/tipos-escritura
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/audit
          curl -fsS -H 'Content-Type: application/json' -d "{\"codigo\":\"$CODE\",\"senha\":\"$PASS\"}" http://127.0.0.1:8080/api/consulta
